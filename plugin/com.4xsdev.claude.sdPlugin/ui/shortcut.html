<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script></head>
<body>
<sdpi-item label="Shortcut">
  <sdpi-select setting="shortcut" default="new-chat">
    <option value="new-chat">New chat (⌘N)</option>
    <option value="new-session">New Claude Code session (⌘⇧O)</option>
    <option value="search">Search (⌘⇧K)</option>
    <option value="palette">Command palette (⌘K)</option>
    <option value="sidebar">Toggle sidebar (⌘B)</option>
    <option value="prev-session">Previous session (⌘⇧[)</option>
    <option value="next-session">Next session (⌘⇧])</option>
    <option value="side-chat">Side chat (⌘;)</option>
  </sdpi-select>
</sdpi-item>
</body></html>
